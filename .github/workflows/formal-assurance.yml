name: Formal assurance

# VirtualQuest's private formal suite, run here because the private repository
# has no hosted Actions: TLC, Lean and GenMC (check.ps1 -Core) on four runners.
# A release can also run the complete numeric suite (ESBMC and Gappa) on four
# runners of its own, at the same time. The caller says which of the two to
# run (tools/ci/formal-scope.py decides for both workflows).
#
# This repository is public, so anyone can read its logs and artifacts. Each
# private check writes its output to the runner's temp folder, never to the log
# (tools/ci/run-private-check.py), and the private Docker images are built
# quietly: the log shows how many checks passed and the names of any that did
# not. Investigate a failure locally.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to check; the caller's own by default
        type: string
        default: ''
      core:
        description: Run the private core
        type: boolean
        default: true
      numeric:
        description: Also run the complete numeric suite, as a release whose numeric inputs changed does
        type: boolean
        default: false
    secrets:
      VIRTUALQUEST_DEPLOY_KEY:
        description: Read-only deploy key on the private VirtualQuest repository
        required: false

permissions:
  contents: read

env:
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0
  # elan at a pinned release, checked against the digest GitHub lists for it;
  # its install script would fetch whatever release is newest.
  ELAN_URL: https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63

jobs:
  # The Docker images the proofs run in, found or built once for every share.
  # GenMC and ESBMC are built from source, which takes a long while, so an
  # image is cached by its Dockerfile's hash; a run from a tag cannot read the
  # caches a branch saved, and without this job every share would build it.
  images:
    if: inputs.core || inputs.numeric
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1

      - name: Find the GenMC image
        id: genmc
        if: inputs.core
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-genmc.tar
          key: questcal-genmc-${{ hashFiles('VirtualQuest/formal/seqlock/Dockerfile') }}
          lookup-only: true

      - name: Build the GenMC image
        if: inputs.core && steps.genmc.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          docker build -q -t questcal-genmc VirtualQuest/formal/seqlock > /dev/null 2>&1 || { echo 'Building the GenMC image failed.'; exit 1; }
          docker save -o "$RUNNER_TEMP/questcal-genmc.tar" questcal-genmc

      - name: Save the GenMC image
        if: inputs.core && steps.genmc.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-genmc.tar
          key: questcal-genmc-${{ hashFiles('VirtualQuest/formal/seqlock/Dockerfile') }}

      - name: Find the ESBMC image
        id: esbmc
        if: inputs.numeric
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-esbmc.tar
          key: questcal-esbmc-${{ hashFiles('VirtualQuest/formal/input-validation/Dockerfile') }}
          lookup-only: true

      - name: Build the ESBMC image
        if: inputs.numeric && steps.esbmc.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          docker build -q -t questcal-esbmc VirtualQuest/formal/input-validation > /dev/null 2>&1 || { echo 'Building the ESBMC image failed.'; exit 1; }
          docker save -o "$RUNNER_TEMP/questcal-esbmc.tar" questcal-esbmc

      - name: Save the ESBMC image
        if: inputs.numeric && steps.esbmc.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-esbmc.tar
          key: questcal-esbmc-${{ hashFiles('VirtualQuest/formal/input-validation/Dockerfile') }}

  # check.ps1 -Shard balances the shares by the time each check last took. On
  # six runners each share took six to nine minutes, setup included; four
  # should take about twelve, still well inside the input-validation proofs a
  # push waits for, with two runners fewer.
  private-core:
    if: inputs.core
    name: private-core (${{ matrix.shard }}/4)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Every share reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1

      - name: Tools this share needs
        id: share
        shell: pwsh
        run: |
          $checks = pwsh -NoProfile -File VirtualQuest/formal/check.ps1 -Core -ListChecks -SourceRoot $PWD -Shard ${{ matrix.shard }}/4 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Listing the checks of this share failed.' }
          foreach ($tool in 'genmc', 'lean') {
            "$tool=$(([bool]@($checks | Where-Object Tool -eq $tool)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          }

      - name: Java for TLC
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: tla2tools.jar v1.7.4
        run: |
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL "$TLA2TOOLS_URL" -o "$jar"
          echo "$TLA2TOOLS_SHA256  $jar" | sha256sum -c - > /dev/null
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"

      - name: Restore Lean
        id: lean-cache
        if: steps.share.outputs.lean == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-v4.2.4-${{ env.LEAN_TOOLCHAIN }}

      - name: Install Lean
        if: steps.share.outputs.lean == 'true' && steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "$ELAN_URL" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c - > /dev/null
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$LEAN_TOOLCHAIN" > /dev/null

      # Lean's first run on a fresh runner is far slower than any later one:
      # the first proof of each share failed under check.ps1's two-minute
      # limit while every later one passed. A throwaway import takes that run.
      - name: Warm up Lean
        if: steps.share.outputs.lean == 'true'
        timeout-minutes: 15
        run: |
          echo 'import Lean' > "$RUNNER_TEMP/warm-up.lean"
          ~/.elan/bin/lean "$RUNNER_TEMP/warm-up.lean"

      - name: Restore the GenMC image
        if: steps.share.outputs.genmc == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-genmc.tar
          key: questcal-genmc-${{ hashFiles('VirtualQuest/formal/seqlock/Dockerfile') }}
          fail-on-cache-miss: true

      - name: Load the GenMC image
        if: steps.share.outputs.genmc == 'true'
        timeout-minutes: 10
        run: docker load -i "$RUNNER_TEMP/questcal-genmc.tar" > /dev/null

      - name: Check share ${{ matrix.shard }} of 4
        timeout-minutes: 60
        env:
          # TLC's default heap is a quarter of the runner's memory.
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: >
          python tools/ci/run-private-check.py --label "private core ${{ matrix.shard }}/4"
          --raw "$RUNNER_TEMP/core-raw.json" --
          pwsh -NoProfile -File VirtualQuest/formal/check.ps1 -Core -Strict -Shard ${{ matrix.shard }}/4
          -SourceRoot "$PWD" -ResultPath "$RUNNER_TEMP/core-raw.json"

  # Every numeric obligation: the expanded 64-frame checks need one
  # memory-heavy process per runner.
  numeric:
    if: inputs.numeric
    name: numeric (${{ matrix.shard }}/4)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1

      - name: Restore the ESBMC image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-esbmc.tar
          key: questcal-esbmc-${{ hashFiles('VirtualQuest/formal/input-validation/Dockerfile') }}
          fail-on-cache-miss: true

      - name: Load the ESBMC image
        timeout-minutes: 10
        run: docker load -i "$RUNNER_TEMP/questcal-esbmc.tar" > /dev/null

      - name: Check share ${{ matrix.shard }} of 4
        timeout-minutes: 75
        run: >
          python tools/ci/run-private-check.py --label "numeric ${{ matrix.shard }}/4"
          --raw "$RUNNER_TEMP/numeric-raw.json" --
          pwsh -NoProfile -File VirtualQuest/formal/check.ps1 -Only input-validation -Strict -Shard ${{ matrix.shard }}/4
          -SourceRoot "$PWD" -ResultPath "$RUNNER_TEMP/numeric-raw.json"

