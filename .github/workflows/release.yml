name: Release

# Pushing a questcalibrator-v* tag builds it on a clean Windows machine with the
# full test suite (VirtualQuest included) and the pose hub trace replay through
# its TLA+ model, analyzes it with Clang-Tidy, proves it against VirtualQuest's
# formal suite on Linux (formal-assurance.yml), packages it, scans it on
# VirusTotal, creates a DRAFT release here, and runs the install test on that
# draft. Nothing reaches users until the draft is published by hand.
#
# Installed copies look for updates only in VividNightmareUnleashed/QuestCalibrator,
# so a run anywhere else (a fork, or this repository under another name) stops
# before building.
#
# Secrets:
#   VIRTUALQUEST_DEPLOY_KEY  read-only deploy key on VirtualQuest. Required: a
#                            release is never tested on less than a local one.
#   VT_API_KEY               VirusTotal API key. Without it the scan is skipped
#                            and the release notes say so.
#   MINISIGN_SECRET_KEY      the release signing key: the text of its minisign
#                            .key file. Installed copies update only to a
#                            package it signed, so a stable tag fails without it
#                            (docs/releasing.md, Signing).
#   MINISIGN_PASSWORD        that key's password.
# The release is written with the workflow's own token.
on:
  push:
    tags: ['questcalibrator-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing questcalibrator-v* tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REPO: VividNightmareUnleashed/QuestCalibrator
  TAG: ${{ inputs.tag || github.ref_name }}
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
  MINISIGN_SHA256: 37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479

# Jobs: check refuses what must not be built, in seconds; build tests,
# packages and scans, and keeps the result with the run; beside it, traces
# replays the pose hub traces through their model and runs the duplicate scan,
# and clang-tidy analyzes the tagged source (clang-tidy.yml), where any
# first-party finding stops the release; formal-scope picks the formal jobs
# whose inputs changed since the last commit where each passed, and
# formal-assurance runs those; publish creates the draft from the kept package
# once all of them passed. A failed publish is repeated with
# "Re-run failed jobs" in a minute, without building again.
#
# A tag on a commit whose message contains [skip release] starts nothing
# (every later job needs check, so they skip too); cut that release locally
# with install\release.ps1 instead. A run started by hand always goes ahead.
jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write only so that drafts are visible: a token that cannot write here
    # sees no drafts, and would miss one this tag already has.
    permissions:
      contents: write

    steps:
      - name: Refuse the wrong repository or an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VQ_KEY_SET: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY != '' }}
          SIGNING_KEY_SET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne $env:RELEASE_REPO) {
            throw "Releases are made only in $env:RELEASE_REPO, where installed copies look for updates; this is $env:GITHUB_REPOSITORY."
          }
          if ($env:VQ_KEY_SET -ne 'true') {
            throw 'The VIRTUALQUEST_DEPLOY_KEY secret is not set; a release needs the full test suite.'
          }
          # A prerelease tag has a suffix after the version.
          if ($env:TAG -notmatch '^questcalibrator-v\d+\.\d+\.\d+-' -and $env:SIGNING_KEY_SET -ne 'true') {
            throw 'The MINISIGN_SECRET_KEY secret is not set; installed copies take only a stable release the release key signed.'
          }
          # Only "release not found" means there is none; anything else (no
          # access, a network error) must stop the run here rather than after
          # the build.
          $answer = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "$env:GITHUB_REPOSITORY already has a release for $env:TAG. Never replace a release; tag a new version."
          }
          if ("$answer" -notmatch 'release not found') {
            throw "Could not check $env:GITHUB_REPOSITORY for $env:TAG`: $answer"
          }
          $global:LASTEXITCODE = 0

  build:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      scenarios: ${{ steps.build.outputs.scenarios }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      - name: Build and run the full test suite
        timeout-minutes: 30
        id: build
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Build | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw 'The build or the solver tests failed.' }
          $count = ($log | Select-String -Pattern 'Solver tests passed: (\d+) scenario' | Select-Object -Last 1).Matches[0].Groups[1].Value
          "scenarios=$count" >> $env:GITHUB_OUTPUT

      # Code signing of the exe and driver DLL goes here, once a certificate is
      # set up, so the package and its hashes cover the signed files.

      # Only stable releases are signed, and only they see the key: the
      # updater never offers a prerelease. A prerelease tag has a suffix.
      - name: Tell a stable release from a prerelease
        id: kind
        shell: pwsh
        run: |
          "stable=$(($env:TAG -notmatch '^questcalibrator-v\d+\.\d+\.\d+-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install minisign
        if: steps.kind.outputs.stable == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'minisign.zip'
          Invoke-WebRequest -Uri $env:MINISIGN_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MINISIGN_SHA256) { throw "The minisign archive has SHA-256 $hash, not the pinned one." }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'minisign')

      # The packaging install\release.ps1 shares: the version against the tag,
      # VirtualQuest against its pin, BUILD-INFO.txt, the package, a stable
      # release's signature, the VirusTotal scan (skipped, and the notes say
      # so, without the key) and the release notes in install\out\notes.md.
      - name: Package, sign, scan and write the notes
        timeout-minutes: 40
        id: package
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          MINISIGN_SECRET_KEY: ${{ steps.kind.outputs.stable == 'true' && secrets.MINISIGN_SECRET_KEY || '' }}
          MINISIGN_PASSWORD: ${{ steps.kind.outputs.stable == 'true' && secrets.MINISIGN_PASSWORD || '' }}
        run: |
          $minisign = Join-Path $env:RUNNER_TEMP 'minisign\minisign-win64\x86_64\minisign.exe'
          $release = install\package-release.ps1 -Tag $env:TAG -Scenarios ${{ steps.build.outputs.scenarios }} -Minisign $minisign -BuildInfo @(
            "runner_image=$env:ImageOS $env:ImageVersion"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Keep the package with this run
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ env.TAG }}
          path: |
            install/out/*.zip
            install/out/*.sha256
            install/out/*.minisig
            install/out/*.virustotal.md
            install/out/notes.md
          if-no-files-found: error
          retention-days: 90

  # Its own build of the tag, so neither check waits on the other or holds up
  # packaging and the VirusTotal scan.
  traces:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      # The build job runs the suite; this one needs only SolverTests.exe to
      # record the hub runs.
      - name: Build
        timeout-minutes: 30
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Compile
          if ($LASTEXITCODE -ne 0) { throw 'The build failed.' }

      - name: Replay the pose hub traces through the model
        timeout-minutes: 10
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'tla2tools.jar'
          Invoke-WebRequest -Uri $env:TLA2TOOLS_URL -OutFile $jar
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:TLA2TOOLS_SHA256) { throw "tla2tools.jar has SHA-256 $hash, not the pinned one." }
          $env:TLA2TOOLS_JAR = $jar
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:Path = "$env:JAVA_HOME_17_X64\bin;$env:Path"
          pwsh -NoProfile -File VirtualQuest\formal\check.ps1 -Only Traces
          if ($LASTEXITCODE -ne 0) { throw 'A recorded hub run is not a behaviour of the model.' }

      - name: Duplicate scan (advisory)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          npm install --global --no-fund --no-audit jscpd@5.0.12 | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Duplicates
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::The duplicate scan reported clones; review them before publishing.'; exit 1 }

  # The env context is not available where a reusable workflow is called, so
  # the tag is spelled out as TAG is above.
  clang-tidy:
    needs: check
    uses: ./.github/workflows/clang-tidy.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
    secrets:
      VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}

  # The formal jobs are deterministic, so one whose inputs are unchanged since
  # the last commit where it passed (in validation or an earlier release) would
  # pass again; tools/ci/formal-scope.py says which still need to run.
  formal-scope:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      input_validation: ${{ steps.scope.outputs.input_validation }}
      core: ${{ steps.scope.outputs.core }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1
      - name: Work out which formal jobs the tag needs
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/formal-scope.py --last-green

  formal-assurance:
    needs: [check, formal-scope]
    if: needs.formal-scope.outputs.core == 'true' || needs.formal-scope.outputs.input_validation == 'true'
    uses: ./.github/workflows/formal-assurance.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      core: ${{ needs.formal-scope.outputs.core == 'true' }}
      numeric: ${{ needs.formal-scope.outputs.input_validation == 'true' }}
    secrets:
      VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}

  # formal-assurance is skipped when every formal job's inputs are proved
  # already, so publish asks for each result rather than plain needs.
  publish:
    needs: [build, traces, clang-tidy, formal-scope, formal-assurance]
    if: >-
      always() && needs.build.result == 'success' && needs.traces.result == 'success' &&
      needs.clang-tidy.result == 'success' && needs.formal-scope.result == 'success' &&
      (needs.formal-assurance.result == 'success' || needs.formal-assurance.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ env.TAG }}

    steps:
      - name: Fetch the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-${{ env.TAG }}
          path: package

      - name: Create the draft release
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-Item package/*.zip).FullName
          $assets = @($zip, "$zip.sha256")
          # Packaging refuses a stable release it could not sign.
          if (Test-Path -LiteralPath "$zip.minisig") { $assets += "$zip.minisig" }
          elseif ('${{ needs.build.outputs.prerelease }}' -ne 'true') { throw 'The stable package has no signature.' }
          # The check job refused an existing release, so a draft here is this
          # run's own, left by an attempt that failed partway: finish its
          # uploads instead of creating a second one.
          $draft = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "$env:TAG is already published in $env:GITHUB_REPOSITORY." }
            gh release upload $env:TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading to the existing draft failed.' }
            Write-Host "::notice::Finished the existing draft for $env:TAG."
            exit 0
          }
          $global:LASTEXITCODE = 0

          $arguments = @('release', 'create', $env:TAG) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--draft',
            '--title', 'QuestCalibrator ${{ needs.build.outputs.version }}',
            '--notes-file', 'package/notes.md'
          )
          if ('${{ needs.build.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          Write-Host "::notice::Draft release created for $env:TAG from ${{ needs.build.outputs.scenarios }} passing scenarios."

  install-test:
    needs: publish
    # The implicit success() also looks past publish, and a skipped
    # formal-assurance would skip the test while the run stays green.
    if: always() && needs.publish.result == 'success'
    # The install test downloads the draft, which only a token that can write
    # here can see.
    permissions:
      contents: write
    uses: ./.github/workflows/install-test.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
